name: Parole · Release signée
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.13'}
      - name: Prepare signing and validate deployment config
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          FIREBASE_CONFIG: ${{ secrets.GOOGLE_SERVICES_JSON }}
          API_URL: ${{ vars.PAROLE_API_URL }}
          ADMOB_APP: ${{ vars.ADMOB_APP_ID }}
          ADMOB_UNIT: ${{ vars.ADMOB_REWARDED_ID }}
        run: |
          test -n "$KEYSTORE" || { echo 'Missing release keystore'; exit 1; }
          test -n "$FIREBASE_CONFIG" || { echo 'Missing Firebase Android config'; exit 1; }
          test -n "$ADMOB_APP" && test -n "$ADMOB_UNIT" || { echo 'Missing production AdMob IDs'; exit 1; }
          case "$API_URL" in https://*) ;; *) echo 'Missing HTTPS API URL'; exit 1;; esac
          curl --fail --silent "$API_URL/ready"
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/parole-release.jks"
          printf '%s' "$FIREBASE_CONFIG" > app/google-services.json
      - name: Build signed APK and AAB
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/parole-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PAROLE_API_URL: ${{ vars.PAROLE_API_URL }}
          ADMOB_APP_ID: ${{ vars.ADMOB_APP_ID }}
          ADMOB_REWARDED_ID: ${{ vars.ADMOB_REWARDED_ID }}
        run: gradle --no-daemon :app:lintRelease :app:testReleaseUnitTest :app:assembleRelease :app:bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: Parole-release-signed
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
